spring:
  datasource:
    url: jdbc:h2:mem:mydb
    username: sa
    password: password
    driverClassName: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-a-long-random-value-at-least-32-bytes}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
