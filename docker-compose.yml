services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: productdb
      POSTGRES_USER: product
      POSTGRES_PASSWORD: product
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product -d productdb"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/productdb
      DB_USERNAME: product
      DB_PASSWORD: product
      JWT_SECRET: change-me-in-production-use-a-strong-32-byte-secret
      APP_CORS_ORIGIN: http://localhost:3000
    ports: ["8080:8080"]
volumes:
  postgres_data:
